apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ashta-chamma
  labels:
    app: ashta-chamma
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # cert-manager issues a Let's Encrypt certificate automatically via HTTP-01 challenge
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ashta-chamma.agent.opsera.dev
      # cert-manager creates this secret automatically once the HTTP-01 challenge passes
      secretName: ashta-chamma-tls
  rules:
    - host: ashta-chamma.agent.opsera.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ashta-chamma
                port:
                  number: 80
