name: Deploy Frontend

on:
  push:
    branches:
      - master
    paths:
      - 'client/**'
      - 'lighthouserc.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Prevent concurrent deployments from running over each other.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build the optimized Vite production bundle and run Lighthouse CI.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-lighthouse:
    name: Build + Lighthouse CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      # Build with the bundle analyzer enabled so the stats report is
      # available as a CI artifact for review (acceptance criterion 7).
      - name: Build production bundle (with analysis report)
        run: ANALYZE=true npm run build
        env:
          NODE_ENV: production

      # Upload the stats.html treemap as a workflow artifact so developers
      # can inspect chunk sizes from the Actions UI.
      - name: Upload bundle analysis report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: client/dist/stats.html
          retention-days: 14

      # Upload the full dist/ directory so the deploy job can download it
      # without rebuilding.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist/
          retention-days: 1

      # Run Lighthouse CI against the freshly-built production bundle.
      # The lighthouserc.js at repo root defines the assertion thresholds
      # (performance ≥ 85 on the main menu page).
      - name: Run Lighthouse CI
        working-directory: ${{ github.workspace }}
        run: |
          cd client
          npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Sync the dist/ output to S3 with correct Cache-Control headers.
  #    Runs only after the build + Lighthouse job succeeds.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-s3:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build-and-lighthouse
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    environment:
      name: production
      url: https://${{ secrets.CLOUDFRONT_DOMAIN }}

    permissions:
      id-token: write  # Required for OIDC-based AWS credentials.
      contents: read

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 1: Upload hashed static assets (JS chunks, CSS, WASM, GLB/GLTF,
      # fonts, images) with a 1-year immutable cache.  Vite content-hashes all
      # chunk filenames so these can be cached indefinitely — a new deploy
      # generates new hashes, so there is no stale-content risk.
      - name: Sync hashed static assets (1-year cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/  \
            --exclude "index.html"                          \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      # Step 2: Upload index.html separately with no-cache so browsers always
      # re-fetch it and pick up new chunk hashes after a deployment.  Without
      # this, a cached old index.html would reference chunk hashes that no
      # longer exist in S3 after a deploy, causing 404s for returning users.
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"            \
            --content-type "text/html; charset=utf-8"

      # Invalidate the CloudFront distribution so the new index.html is served
      # immediately.  Hashed assets do not need invalidation — new URLs.
      - name: Invalidate CloudFront cache for index.html
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
